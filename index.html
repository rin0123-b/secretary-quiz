<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>秘書検定準1級クイズ（解説付き）</title>
<style>
body{font-family:"Yu Gothic","Hiragino Maru Gothic ProN",sans-serif;background:linear-gradient(135deg,#ffd9ec,#d8f1ff);display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}
.card{background:#fff;width:90%;max-width:760px;padding:25px;border-radius:28px;box-shadow:0 8px 25px rgba(0,0,0,.12)}
h1{text-align:center;color:#ff78b0}
.question{font-size:22px;margin:20px 0}
.btn{width:100%;padding:15px;margin:8px 0;border:none;border-radius:18px;font-size:18px;cursor:pointer}
.a{background:#ffd6e7}.b{background:#d6ecff}.c{background:#eadcff}.d{background:#d8fff2}
#result{font-size:28px;font-weight:bold;text-align:center;margin:10px}
#explain{background:#f7f7ff;border-radius:18px;padding:15px;margin-top:10px;display:none}
#next{display:none;background:#ffb6d9;color:#fff;border:none;padding:12px 24px;border-radius:18px;font-size:18px}
.center{text-align:center}
</style></head><body>
<div class="card">
<h1>🐰 秘書検定準1級クイズ</h1>
<div id="quiz"></div>
<div id="result"></div>
<div id="explain"></div>
<div class="center"><button id="next">次へ</button></div>
</div>
<script>
const data=[
{q:"上司が会議中に重要取引先から至急電話がありました。最も適切な対応は？",c:["会議中なので電話を切る","要件と連絡先を伺い会議後に伝える","秘書の判断で回答する","折り返し不要と伝える"],a:1,e:"会議を妨げずに相手への対応も行うことが大切です。要件と連絡先を確認し、会議後に上司へ確実に伝えます。"},
{q:"出張中の上司に確認が必要な案件。本日中の回答を求められた場合は？",c:["確認せず回答","回答を断る","事情を説明し確認後回答","連絡を無視する"],a:2,e:"正確な回答を優先しながら、相手には事情を説明して安心してもらうことが重要です。"},
{q:"上司の会議が長引き来客対応が遅れる場合は？",c:["待たせる","無断で取消す","状況説明とお詫びをする","秘書が商談する"],a:2,e:"来客への配慮として、状況説明とお詫びを行い、見通しを伝えるのが適切です。"},
{q:"資料作成で不明点がある場合は？",c:["推測で作る","放置する","上司に確認する","他部署へ任せる"],a:2,e:"秘書業務では正確性が重要です。不明点は確認してから進めます。"},
{q:"訪問先担当者が不在で面会できない場合は？",c:["何も言わず帰る","苦情を言う","資料や伝言を預ける","無期限に待つ"],a:2,e:"資料や伝言を残し、今後の連絡方法を確認することで円滑な関係を保てます。"}
];
let i=0,score=0;
function show(){
 const q=data[i];
 document.getElementById("result").textContent="";
 document.getElementById("explain").style.display="none";
 document.getElementById("next").style.display="none";
 document.getElementById("quiz").innerHTML=`<div>問題 ${i+1}/${data.length}</div><div class="question">${q.q}</div>${q.c.map((x,n)=>`<button class="btn ${['a','b','c','d'][n]}" onclick="answer(${n})">${x}</button>`).join('')}`;
}
window.answer=function(n){
 const q=data[i];
 document.querySelectorAll(".btn").forEach(b=>b.disabled=true);
 document.getElementById("result").textContent=(n===q.a)?"💮 正解！":"😢 残念！";
 if(n===q.a)score++;
 document.getElementById("explain").innerHTML="<b>解説</b><br>"+q.e;
 document.getElementById("explain").style.display="block";
 document.getElementById("next").style.display="inline-block";
}
document.getElementById("next").onclick=()=>{
 i++;
 if(i<data.length)show();
 else{
  document.getElementById("quiz").innerHTML=`<h2>クイズ終了！</h2><p>スコア ${score}/${data.length}</p>`;
  document.getElementById("result").textContent=score===data.length?"🎉 全問正解！":"おつかれさまでした！";
  document.getElementById("explain").style.display="none";
  document.getElementById("next").style.display="none";
 }
}
show();
</script></body></html>
